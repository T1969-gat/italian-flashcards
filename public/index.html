<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Italian Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Italian Flashcards</h1>
      <div class="stats-bar">
        <div class="stat">
          <span class="stat-value" id="score">0 / 0</span>
          <span class="stat-label">Score</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="streak">0</span>
          <span class="stat-label">Streak</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="pct">--%</span>
          <span class="stat-label">Accuracy</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="mastered">0</span>
          <span class="stat-label">Mastered</span>
        </div>
      </div>
    </header>

    <main>
      <div class="card" id="card">
        <div class="card-direction" id="direction"></div>
        <div class="card-category" id="category"></div>
        <div class="card-prompt" id="prompt">Loading...</div>
      </div>

      <div class="input-area">
        <input type="text" id="answer-input" placeholder="Type your answer..." autocomplete="off" autofocus>
        <button id="submit-btn">Check</button>
      </div>

      <div class="feedback hidden" id="feedback">
        <div class="feedback-icon" id="feedback-icon"></div>
        <div class="feedback-text" id="feedback-text"></div>
        <div class="feedback-correct" id="feedback-correct"></div>
        <div class="feedback-hint">Press Enter for next card</div>
      </div>
    </main>

    <footer class="footer">
      <button id="progress-btn" class="progress-btn">View Progress</button>
      <button id="reset-btn" class="reset-btn">Reset Progress</button>
    </footer>
  </div>

  <div class="modal-overlay hidden" id="progress-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Your Progress</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-filters" id="modal-filters"></div>
      <div class="modal-body" id="progress-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
